crons:
  - name: email-retry
    description: "Every 15 minutes: retries failed website emails and sends newsletters whose scheduled time has passed"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/email-retry"
    method: POST
    enabled: true
  - name: followup-reminders
    description: "9:00 am India time daily: lead follow-up reminders and partner agreement renewal reminders (30 days ahead)"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    method: POST
    enabled: true
  - name: weekly-pipeline
    description: "Emails the weekly pipeline summary (new, won, lost, overdue) every Monday 9:00 am India time"
    cron: "0 9 * * 1"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-pipeline"
    method: POST
    enabled: true
