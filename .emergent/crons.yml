crons:
  - name: email-retry
    description: "Retries website emails (invites, resets, enquiry alerts) that failed to send, every 15 minutes"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/email-retry"
    method: POST
    enabled: true
  - name: followup-reminders
    description: "Emails each lead owner their overdue and due-today follow-ups at 9:00 am India time"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    method: POST
    enabled: true
  - name: weekly-pipeline
    description: "Emails the weekly pipeline summary (new, won, lost, overdue) every Monday 9:00 am India time"
    cron: "0 9 * * 1"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-pipeline"
    method: POST
    enabled: true
